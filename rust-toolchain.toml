[toolchain]
# Pinned to 1.85.0 for the same reason CI pins it (see .github/workflows/ci.yml):
# the transitive dep `ethnum 1.5.0` (via soroban-env-common 20.3.0) fails to
# compile on newer rustc, and `base64ct 1.8.3` requires the edition2024
# feature stabilized in 1.85. 1.85.0 is the lowest stable that satisfies both.
# Do not bump without re-verifying `cargo clippy -p sanctifier-core` compiles ethnum.
channel = "1.85.0"
components = ["rustfmt", "clippy"]
