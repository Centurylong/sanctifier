[workspace]
members = ["."]

[package]
name = "sanctifier-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Sanctifier - Stellar Soroban Security Suite"
license = "MIT"
homepage = "https://github.com/Centurylong/sanctifier"
repository = "https://github.com/Centurylong/sanctifier"
keywords = ["soroban", "stellar", "security", "smart-contracts", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "https://github.com/Centurylong/sanctifier/releases/download/v{ version }/sanctifier-{ version }-{ target }.tar.gz"
bin-dir = "sanctifier{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/Centurylong/sanctifier/releases/download/v{ version }/sanctifier-{ version }-{ target }.zip"
pkg-fmt = "zip"

[features]
# Build z3 from source and link it statically (via z3-sys's cmake build),
# so a release binary has no runtime dependency on a system libz3. Used by
# .github/workflows/release.yml and the Dockerfile; the default dev build
# links dynamically against the libz3-dev package CI installs, which is
# faster to build. Deliberately declared only here, not on sanctifier-core
# (which ci.yml builds/tests with `--all-features`) — Cargo unifies features
# for the one shared z3-sys instance in this build regardless, and keeping
# it off sanctifier-core avoids `--all-features` pulling in a from-source z3
# build there too, which ci.yml's dependency install doesn't provision for.
static-link-z3 = ["z3/static-link-z3"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap-markdown = "0.1"
anyhow = "1.0"
sanctifier-core = { version = "0.1.0", path = "../sanctifier-core", features = ["smt"] }
# The language server lives in its own crate so editors can depend on it
# without pulling in the CLI (and its z3 link); this dependency is only so
# `sanctifier lsp` can start it in-process rather than shelling out to a
# second binary the user would have to install separately.
sanctifier-lsp = { version = "0.1.0", path = "../sanctifier-lsp" }
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
colored = "2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
notify = "6"
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3.8"
z3 = "0.12.1"
bulletproofs = "5"
merlin = "3"
curve25519-dalek = "4"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.8"


[[bin]]
name = "sanctifier"
path = "src/main.rs"

