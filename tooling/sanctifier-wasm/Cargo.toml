[workspace]
members = ["."]

[package]
name = "sanctifier-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM wrapper for Sanctifier analysis engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen's generated code references a cfg it sets only in its own test
# harness. Declaring it here keeps `cargo clippy -- -D warnings` usable on this
# crate instead of drowning every real lint in four copies of the same warning.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

[dependencies]
# Pinned to a version whose macro layer compiles with the syn 2.0.39
# that soroban-sdk transitively locks. Newer wasm-bindgen requires a
# newer syn and breaks the build.
wasm-bindgen = "=0.2.93"
js-sys = "=0.3.70"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
sanctifier-core = { path = "../sanctifier-core", default-features = false }

# wasm-opt shrinks the release artifact substantially; -Oz favours size, which
# is what matters for a payload the browser has to download before it can do
# anything. Applied by wasm-pack during `scripts/build-npm.sh`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
